services:
  postgres:
    profiles: [local]
    image: postgres:16-alpine
    container_name: peddi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - peddi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    profiles: [local]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev:server"
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SSL_MODE: disable
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - .:/app
      - peddi-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  peddi-postgres-data:
  peddi-node-modules:
